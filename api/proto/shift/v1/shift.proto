syntax = "proto3";

// Package shift.v1 contains version 1 of the shift scheduling API.
// The "v1" suffix leaves room for a future, incompatible v2 without
// breaking existing clients.
package shift.v1;

import "google/protobuf/timestamp.proto";

// Generated Go code is written to gen/shift/v1 and imported as package shiftv1.
option go_package = "github.com/dishamistry/go-shift-scheduling-grpc/gen/shift/v1;shiftv1";

// ShiftService manages work shifts and the employees assigned to them.
service ShiftService {
  // CreateShift creates a new, unassigned shift.
  rpc CreateShift(CreateShiftRequest) returns (CreateShiftResponse);

  // GetShift returns a single shift by its ID.
  rpc GetShift(GetShiftRequest) returns (GetShiftResponse);

  // AssignEmployee assigns an employee to an existing shift.
  rpc AssignEmployee(AssignEmployeeRequest) returns (AssignEmployeeResponse);
}

// Shift is a block of work time that can be assigned to one employee.
message Shift {
  // Unique identifier of the shift, generated by the server.
  string id = 1;

  // Identifier of the assigned employee. Empty when the shift is unassigned.
  string employee_id = 2;

  // When the shift starts (UTC).
  google.protobuf.Timestamp start_time = 3;

  // When the shift ends (UTC). Expected to be after start_time.
  google.protobuf.Timestamp end_time = 4;
}

message CreateShiftRequest {
  google.protobuf.Timestamp start_time = 1;
  google.protobuf.Timestamp end_time = 2;
}

message CreateShiftResponse {
  Shift shift = 1;
}

message GetShiftRequest {
  string id = 1;
}

message GetShiftResponse {
  Shift shift = 1;
}

message AssignEmployeeRequest {
  string shift_id = 1;
  string employee_id = 2;
}

message AssignEmployeeResponse {
  Shift shift = 1;
}
